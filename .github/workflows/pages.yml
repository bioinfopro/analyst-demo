name: Publish report to GitHub Pages

# GitHub does not render HTML from the repo tree: the blob view shows source and
# the raw endpoint serves text/plain. Publishing to GitHub Pages serves the file
# with Content-Type: text/html so reports/multiqc_report.html renders in a browser at
# https://<owner>.github.io/<repo>/reports/multiqc_report.html

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Disable Jekyll processing
        run: touch .nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
